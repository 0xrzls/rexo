# =============================================================================
# Rialo Contract Build & Deploy Pipeline (Canonical TriggerDesk Standard)
#
# Pinned Versions:
#   - rialoman: 0.3.0
#   - Rialo Release: stable@0.12.2
#   - Rialo Rust Toolchain: 0.0.3
#   - Target: riscv64emac-solana-solana (PolkaVM RISC-V)
#   - Build Tool: rialo-build --program-path ... --output-dir ...
#   - Deploy: rialo client program deploy -n <network> <binary.polkavm>
#   - Verification: Loader V4 (owner RiscVLoader, executable true, +48B offset SHA256)
# =============================================================================

name: Rialo Contract Build & Deploy Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target Rialo Network'
        required: true
        default: 'devnet'
        type: choice
        options: [ devnet, testnet ]
      deploy_contract:
        description: 'Deploy contract after successful compilation'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT_DIR: contracts/rexo-core
  RIALOMAN_VERSION: "0.3.0"
  RIALO_RELEASE_VERSION: "stable@0.12.2"
  RIALO_TOOLCHAIN_VERSION: "0.0.3"

jobs:
  curve-tests:
    name: Curve Math Invariants (21 tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run curve invariant tests
        run: |
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          test -f "$CURVE_SRC" || { echo "::error::curve.rs tidak ditemukan"; exit 1; }
          rustc --test "$CURVE_SRC" -o /tmp/curve_test
          /tmp/curve_test --nocapture

  build-contract:
    name: Compile Rialo Contract (rialo-build)
    runs-on: ubuntu-22.04
    needs: curve-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev curl git \
            clang llvm binaryen ca-certificates cmake ninja-build protobuf-compiler python3 xz-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      # -------------------------------------------------------------------
      # 1. Pasang rialoman 0.3.0 dari S3 rialo-artifacts
      # -------------------------------------------------------------------
      - name: Install rialoman 0.3.0
        run: |
          set -euo pipefail
          echo "--> Memasang rialoman dari bucket S3 resmi..."
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh | bash -s -- --no-modify-path --default-toolchain none
          
          echo "$HOME/.local/share/rialo/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/rialo/bin:$HOME/.cargo/bin:$PATH"
          rialoman --version

      # -------------------------------------------------------------------
      # 2. Pasang Rialo Release stable@0.12.2 & Toolchain rialo-rust 0.0.3
      # -------------------------------------------------------------------
      - name: Install Pinned Rialo 0.12.2 & rialo-rust 0.0.3 (TriggerDesk Standard)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/rialo/bin:$HOME/.cargo/bin:$PATH"
          
          echo "--> Memasang Rialo release ${RIALO_RELEASE_VERSION}..."
          rialoman install "${RIALO_RELEASE_VERSION}" --default
          rialoman use "${RIALO_RELEASE_VERSION}" || true
          
          echo "--> Memasang toolchain rialo-rust versi ${RIALO_TOOLCHAIN_VERSION}..."
          if ! rialoman toolchain install rialo-rust --version "${RIALO_TOOLCHAIN_VERSION}"; then
            echo "Prebuilt toolchain unavailable; building with repository rialo-build-lib 0.12.2 helper..."
            cargo run --release \
              --manifest-path "scripts/rialo-toolchain-bootstrap/Cargo.toml" \
              -- "${RIALO_TOOLCHAIN_VERSION}"
          fi
          
          rialoman list
          rialoman current
          rustup toolchain list

      # -------------------------------------------------------------------
      # 3. Diagnostik Lingkungan Toolchain & Target Discovery
      # -------------------------------------------------------------------
      - name: Inspect Toolchain & Environment Diagnostics
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/share/rialo/bin:$HOME/.cargo/bin:$PATH"
          
          echo "=== rialoman ==="
          rialoman --version || true
          
          echo "=== rialoman list ==="
          rialoman list || true
          
          echo "=== rialoman toolchain list ==="
          rialoman toolchain list || true
          
          echo "=== rustup toolchain list ==="
          rustup toolchain list || true
          
          echo "=== cargo +rialo ==="
          cargo +rialo --version || true
          
          echo "=== rustc +rialo ==="
          rustc +rialo --version --verbose || true
          
          echo "=== rustc targets (riscv/solana) ==="
          rustc +rialo --print target-list | grep -iE 'riscv|solana' || true
          
          echo "=== rialo binaries & directories ==="
          find "$HOME/.local/share/rialo" -maxdepth 4 -type f \( -name rustc -o -name cargo -o -name "rialo-build*" \) -print || true

      - name: Cache Cargo & Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.CONTRACT_DIR }}/target/
          key: ${{ runner.os }}-cargo-rialo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rialo-

      # -------------------------------------------------------------------
      # 4. Kompilasi Kontrak menggunakan rialo-build kanonik
      # -------------------------------------------------------------------
      - name: Compile Contract via rialo-build
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: "debug"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/rialo/bin:$HOME/.cargo/bin:$PATH"
          
          echo "=== Menjalankan rialo-build terhadap ${CONTRACT_DIR} ==="
          mkdir -p "${CONTRACT_DIR}/artifacts"
          
          rialo-build \
            --program-path "${CONTRACT_DIR}" \
            --output-dir "${CONTRACT_DIR}/artifacts"
            
          ls -la "${CONTRACT_DIR}/artifacts/"

      # -------------------------------------------------------------------
      # 5. Packaging & SHA256 Artifact Verification
      # -------------------------------------------------------------------
      - name: Package & Validate Artifacts
        run: |
          set -euo pipefail
          mkdir -p build-output
          
          find "${CONTRACT_DIR}/artifacts" -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.json" -o -name "*.wit" \) \
            -exec cp -v {} build-output/ \;
            
          [ -d "${CONTRACT_DIR}/wit" ] && cp -r "${CONTRACT_DIR}/wit" build-output/ || true
          
          echo "=== Daftar Artifact yang Dihasilkan ==="
          ls -la build-output/
          
          echo "=== SHA-256 Hashes ==="
          sha256sum build-output/* || true
          
          COUNT=$(find build-output -type f -name "*.polkavm" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Tidak ada binary .polkavm yang dihasilkan oleh rialo-build!"
            exit 1
          fi

      - name: Upload Contract Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: build-output/
          retention-days: 14
          if-no-files-found: error

  deploy-contract:
    name: Deploy to ${{ inputs.network }}
    needs: build-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contract }}
    runs-on: ubuntu-22.04
    environment: ${{ inputs.network }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: ${{ github.workspace }}/artifacts

      - name: Verify Artifact Present
        run: |
          ls -la "${GITHUB_WORKSPACE}/artifacts"
          POLKAVM_FILE=$(find "${GITHUB_WORKSPACE}/artifacts" -type f -name "*.polkavm" | head -1)
          if [ -z "${POLKAVM_FILE}" ] || [ ! -f "${POLKAVM_FILE}" ]; then
            echo "::error::File .polkavm tidak ditemukan di direktori artifacts!"
            exit 1
          fi
          echo "POLKAVM_PATH=${POLKAVM_FILE}" >> $GITHUB_ENV
          echo "Artifact SHA256: $(sha256sum "${POLKAVM_FILE}" | awk '{print $1}')"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rialo CLI (0.12.2)
        run: |
          set -euo pipefail
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh | bash -s -- --no-modify-path --default-toolchain none
          export PATH="$HOME/.local/share/rialo/bin:$PATH"
          echo "$HOME/.local/share/rialo/bin" >> $GITHUB_PATH
          
          rialoman install "${RIALO_RELEASE_VERSION}" --default
          rialo --version

      - name: Configure Signing Keypair (Real Deployer Key)
        env:
          RIALO_DEPLOY_KEY: ${{ secrets.RIALO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RIALO_DEPLOY_KEY}" ]; then
            echo "::error::Secret RIALO_DEPLOY_KEY belum diset. Buka Repo > Settings > Secrets > Actions."
            exit 1
          fi
          umask 077
          mkdir -p ~/.config/rialo
          printf '%s' "${RIALO_DEPLOY_KEY}" > ~/.config/rialo/deployer.keypair
          chmod 600 ~/.config/rialo/deployer.keypair
          
          python3 - <<'EOF'
          import json, os, sys
          p = os.path.expanduser("~/.config/rialo/deployer.keypair")
          try:
              k = json.load(open(p))
          except Exception as e:
              print(f"::error::deployer.keypair bukan JSON valid: {e}"); sys.exit(1)
          if not isinstance(k, list) or len(k) != 64:
              print(f"::error::Keypair harus array 64 byte, dapat {type(k).__name__} panjang {len(k) if isinstance(k, list) else '?'}")
              sys.exit(1)
          if any((not isinstance(b, int)) or b < 0 or b > 255 for b in k):
              print("::error::Keypair berisi nilai di luar rentang byte 0..255"); sys.exit(1)
          print("Keypair deployer 64-byte terverifikasi valid.")
          EOF

      - name: Fund Deployer (2x Airdrop for Loader V4 Rent Buffer)
        run: |
          set -uo pipefail
          echo "Meminta 2x airdrop (kebutuhan rent buffer Loader V4 ~1.07 RLO)..."
          rialo client airdrop -n ${{ inputs.network }} --amount 1 || echo "::warning::Airdrop 1 gagal / rate-limited"
          sleep 3
          rialo client airdrop -n ${{ inputs.network }} --amount 1 || echo "::warning::Airdrop 2 gagal / rate-limited"

      # -------------------------------------------------------------------
      # Deploy langsung binary .polkavm
      # -------------------------------------------------------------------
      - name: Deploy Program Binary (.polkavm)
        run: |
          set -euo pipefail
          echo "Deploying binary artifact: ${POLKAVM_PATH}"
          rialo client program deploy -n ${{ inputs.network }} "${POLKAVM_PATH}" 2>&1 | tee /tmp/deploy.log
          
          # Ekstrak Program ID
          PROGRAM_ID=$(grep -oE '[1-9A-HJ-NP-Za-km-z]{32,44}' /tmp/deploy.log | head -1 || true)
          if [ -z "${PROGRAM_ID}" ]; then
            echo "::error::Tidak berhasil mengekstrak Program ID dari output deploy."
            exit 1
          fi
          echo "PROGRAM_ID=${PROGRAM_ID}" >> $GITHUB_ENV
          echo "Deployed Program ID: ${PROGRAM_ID}"

      # -------------------------------------------------------------------
      # Verifikasi Hakiki On-Chain (Loader V4 48-Byte Header + Exact Payload SHA256)
      # -------------------------------------------------------------------
      - name: Verify On-Chain Account & Payload Hash
        run: |
          set -euo pipefail
          echo "Memverifikasi akun program on-chain: ${PROGRAM_ID}"
          
          ACCOUNT_JSON=$(rialo client account -n ${{ inputs.network }} --json "${PROGRAM_ID}")
          
          OWNER=$(echo "${ACCOUNT_JSON}" | jq -r .owner)
          EXECUTABLE=$(echo "${ACCOUNT_JSON}" | jq -r .executable)
          
          echo "Owner: ${OWNER}"
          echo "Executable: ${EXECUTABLE}"
          
          if [ "${OWNER}" != "RiscVLoader11111111111111111111111111111111" ]; then
            echo "::error::Owner akun bukan RiscVLoader11111111111111111111111111111111, melainkan ${OWNER}"
            exit 1
          fi
          
          if [ "${EXECUTABLE}" != "true" ]; then
            echo "::error::Akun program tidak berstatus executable=true!"
            exit 1
          fi
          
          # Hitung SHA-256 payload on-chain (skip 48-byte header Loader V4)
          ONCHAIN_PAYLOAD_SHA=$(echo "${ACCOUNT_JSON}" | jq -r .data | base64 -d | tail -c +49 | sha256sum | awk '{print $1}')
          LOCAL_ARTIFACT_SHA=$(sha256sum "${POLKAVM_PATH}" | awk '{print $1}')
          
          echo "Local Artifact SHA256:   ${LOCAL_ARTIFACT_SHA}"
          echo "On-Chain Payload SHA256: ${ONCHAIN_PAYLOAD_SHA}"
          
          if [ "${ONCHAIN_PAYLOAD_SHA}" != "${LOCAL_ARTIFACT_SHA}" ]; then
            echo "::error::Hash on-chain payload tidak cocok dengan artifact lokal!"
            exit 1
          fi
          
          echo "VERIFIKASI SUKSES: Payload on-chain 100% identik dengan artifact lokal."
          
          echo "### Ringkasan Deployment ke ${{ inputs.network }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Program ID**: \`${PROGRAM_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Loader**: \`${OWNER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Executable**: \`${EXECUTABLE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256 (Payload offset +48B)**: \`${ONCHAIN_PAYLOAD_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe Keypair
        if: always()
        run: shred -u ~/.config/rialo/deployer.keypair 2>/dev/null || rm -f ~/.config/rialo/deployer.keypair
