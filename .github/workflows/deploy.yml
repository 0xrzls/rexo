# =============================================================================
# Rialo Contract Build & Deploy Pipeline
# =============================================================================

name: Rialo Contract Build & Deploy Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network for deployment'
        required: true
        default: 'devnet'
        type: choice
        options:
          - devnet
          - testnet
      deploy_contract:
        description: 'Deploy contract after successful compilation'
        required: true
        default: false
        type: boolean

env:
  CONTRACT_DIR: contracts/rexo-core
  RIALO_TOOLCHAIN_VERSION: "0.10.1"

jobs:
  curve-tests:
    name: Curve Math Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Run curve invariant tests
        run: |
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          test -f "$CURVE_SRC" || { echo "::error::curve.rs not found at $CURVE_SRC"; exit 1; }
          rustc --test "$CURVE_SRC" -o /tmp/curve_test
          /tmp/curve_test --nocapture

  build-contract:
    name: Compile Rialo Smart Contract
    runs-on: ubuntu-latest
    needs: curve-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev curl git \
            clang llvm binaryen ca-certificates cmake

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Cache Rialo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rialo
            ~/.rialoman
          key: ${{ runner.os }}-rialo-rust-${{ env.RIALO_TOOLCHAIN_VERSION }}
          restore-keys: ${{ runner.os }}-rialo-rust-

      - name: Install rialoman
        run: cargo install rialoman --version 0.3.0

      - name: Install rialo-rust toolchain
        run: |
          if ! rialoman toolchain list 2>/dev/null | grep -q "rialo-rust"; then
             rialoman toolchain install rialo-rust --version "${RIALO_TOOLCHAIN_VERSION}"
          fi

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Compile Venus PDK artifact
        env:
          RUST_BACKTRACE: "full"
        run: |
          cd "${CONTRACT_DIR}"
          test -f artifact/Cargo.toml || { echo "::error::artifact/Cargo.toml not found"; exit 1; }
          cargo build --manifest-path artifact/Cargo.toml --release --verbose

      - name: Package build artifacts
        run: |
          mkdir -p build-output
          find "${CONTRACT_DIR}" -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) \
            -not -path "*/.fingerprint/*" \
            -exec cp -v {} build-output/ \;
          [ -d "${CONTRACT_DIR}/wit" ] && cp -r "${CONTRACT_DIR}/wit" build-output/ || true

      - name: Assert artifact was actually produced
        run: |
          COUNT=$(find build-output -type f \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) | wc -l)
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Build succeeded but no artifact found."
            exit 1
          fi

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: build-output/
          retention-days: 14
          if-no-files-found: error

  deploy-contract:
    name: Deploy Program to ${{ inputs.network }}
    needs: build-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contract }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    steps:
      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: ./artifacts

      - name: Verify artifacts present
        run: |
          COUNT=$(find ./artifacts -type f \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) | wc -l)
          test "${COUNT}" -gt 0 || { echo "::error::No blob/wasm to deploy"; exit 1; }

      - name: Restore Rialo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rialo
            ~/.rialoman
          key: ${{ runner.os }}-rialo-rust-${{ env.RIALO_TOOLCHAIN_VERSION }}

      - name: Install Rialo CLI
        run: cargo install rialoman --version 0.3.0

      - name: Configure signing keypair
        env:
          RIALO_DEPLOY_KEY: ${{ secrets.RIALO_DEPLOY_KEY }}
        run: |
          test -n "${RIALO_DEPLOY_KEY}" || { echo "::error::RIALO_DEPLOY_KEY secret not set"; exit 1; }
          umask 077
          mkdir -p ~/.config/rialo
          printf '%s' "${RIALO_DEPLOY_KEY}" > ~/.config/rialo/id.json

      - name: Switch network
        run: rialo config network switch ${{ inputs.network }}

      - name: Fund deployer
        run: |
          rialo client airdrop --amount 1 || echo "::warning::Airdrop failed"

      - name: Deploy program
        run: |
          cd "${CONTRACT_DIR}"
          rialo client program deploy-venus . | tee /tmp/deploy.log
          grep -oE '[1-9A-HJ-NP-Za-km-z]{32,44}' /tmp/deploy.log | head -1 > /tmp/program_id || true
          echo "PROGRAM_ID=$(cat /tmp/program_id)" >> "$GITHUB_ENV"

      - name: Verify deployment
        run: |
          test -s /tmp/program_id || { echo "::error::No program id in deploy output"; exit 1; }
          echo "### Deployed to ${{ inputs.network }}" >> "$GITHUB_STEP_SUMMARY"
          echo "`${PROGRAM_ID}`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe keypair
        if: always()
        run: shred -u ~/.config/rialo/id.json 2>/dev/null || rm -f ~/.config/rialo/id.json