# =============================================================================
# Rialo Contract Build & Deploy Pipeline
# =============================================================================

name: Rialo Contract Build & Deploy Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target Rialo Network'
        required: true
        default: 'devnet'
        type: choice
        options: [ devnet, testnet ]
      deploy_contract:
        description: 'Deploy contract after successful compilation'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT_DIR: contracts/rexo-core
  RIALOMAN_VERSION: "0.3.0"
  RIALO_TOOLCHAIN_VERSION: "0.0.3"

jobs:
  curve-tests:
    name: Curve Math Invariants (21 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run curve invariant tests
        run: |
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          test -f "$CURVE_SRC" || { echo "::error::curve.rs tidak ditemukan"; exit 1; }
          rustc --test "$CURVE_SRC" -o /tmp/curve_test
          /tmp/curve_test --nocapture

  build-contract:
    name: Compile Rialo Contract (Venus PDK)
    runs-on: ubuntu-latest
    needs: curve-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev curl git \
            clang llvm binaryen ca-certificates cmake python3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install rialoman and stable release
        run: |
          set -euo pipefail
          echo "--> Memasang rialoman resmi dari S3 rialo-artifacts..."
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh | bash -s -- --no-modify-path --default-toolchain none
          
          # Tambahkan bin rialo ke PATH GitHub Actions
          echo "$HOME/.local/share/rialo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/rialo/bin:$PATH"

          echo "--> Memasang release stable@latest dan toolchain rialo-rust..."
          rialoman --version
          rialoman install stable@latest --default
          rialoman list
          rialoman current

      - name: Cache rialo toolchain & releases
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/rialo
          key: ${{ runner.os }}-rialo-release-stable-${{ env.RIALO_TOOLCHAIN_VERSION }}
          restore-keys: ${{ runner.os }}-rialo-release-

      - name: Verify rialo-rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/rialo/bin:$PATH"
          echo "--> Memasang & memverifikasi toolchain rialo-rust versi ${RIALO_TOOLCHAIN_VERSION}..."
          for attempt in 1 2 3; do
            echo "Toolchain installation attempt ${attempt}..."
            if rialoman toolchain install rialo-rust --version "${RIALO_TOOLCHAIN_VERSION}"; then
              break
            fi
            echo "Toolchain attempt ${attempt} failed, retrying..."
            sleep 2
          done
          rialoman toolchain list
          rustup toolchain list

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.CONTRACT_DIR }}/target/
            ${{ env.CONTRACT_DIR }}/artifact/target/
          key: ${{ runner.os }}-cargo-rialo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rialo-

      - name: Validate Contract Syntax (Fase 0 - cargo check)
        run: |
          set -euo pipefail
          cd "${CONTRACT_DIR}"
          echo "=== Menjalankan cargo check rexo-core ==="
          RUST_BACKTRACE=full cargo check --verbose --color always

      - name: Inspect rialo-build-lib toolchain discovery logic
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import glob, os
          matches = glob.glob(os.path.expanduser("~/.cargo/registry/src/**/rialo-build-lib*/**/*.rs"), recursive=True)
          print(f"Daftar file di rialo-build-lib ({len(matches)} files):")
          for path in sorted(matches):
              print(f"
==================== {path} ====================")
              try:
                  print(open(path, errors='ignore').read())
              except Exception as e:
                  print("Error reading:", e)
          EOF

      - name: Compile Venus PDK artifact
        env:
          RUST_BACKTRACE: "full"
          RIALO_RUST_TOOLCHAIN_VERSION: ${{ env.RIALO_TOOLCHAIN_VERSION }}
          RIALO_BUILD_TOOLCHAIN_HOME: /home/runner/.local/share/rialo/toolchains
          RIALO_BUILD_CARGO_PATH: /home/runner/.local/share/rialo/toolchains/rialo-rust-0.0.3/bin/cargo
        run: |
          set -euo pipefail
          cd "${CONTRACT_DIR}"
          test -f artifact/Cargo.toml || { echo "::error::artifact/Cargo.toml tidak ditemukan"; exit 1; }
          
          echo "=== Cek Rustup Toolchains & Direktori Rialo ==="
          rustup toolchain list || true
          ls -la /home/runner/.local/share/rialo/toolchains/ || true
          ls -la /home/runner/.local/share/rialo/toolchains/rialo-rust-0.0.3/bin/ || true

          if ! cargo build --manifest-path artifact/Cargo.toml --release -vv 2>&1 | tee /tmp/cargo-build.log; then
            echo "::error::Kompilasi PDK artifact gagal."
            echo "=== Stack Trace & Panic Details (build.rs:25:13) ==="
            grep -A 5 -B 2 "build.rs:25:13" /tmp/cargo-build.log || tail -n 30 /tmp/cargo-build.log
            exit 1
          fi

      - name: Package build artifacts
        run: |
          mkdir -p build-output
          find "${CONTRACT_DIR}" -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) \
            -not -path "*/.fingerprint/*" \
            -exec cp -v {} build-output/ \;
          [ -d "${CONTRACT_DIR}/wit" ] && cp -r "${CONTRACT_DIR}/wit" build-output/ || true
          ls -la build-output/

      - name: Validate artifacts
        run: python3 .github/scripts/validate-artifact.py build-output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: build-output/
          retention-days: 14
          if-no-files-found: error

  deploy-contract:
    name: Deploy to ${{ inputs.network }}
    needs: build-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contract }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: ./artifacts

      - name: Verify artifacts present
        run: |
          ls -la ./artifacts/
          COUNT=$(find ./artifacts -type f \( -name "*.polkavm" -o -name "*.blob" \) | wc -l)
          [ "${COUNT}" -gt 0 ] || { echo "::error::Tidak ada blob untuk di-deploy"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rialo CLI
        run: |
          cargo install rialoman --version "${RIALOMAN_VERSION}"
          command -v rialo || { echo "::error::Binary 'rialo' tidak ada. Cek nama crate CLI klien."; exit 1; }
          rialo --version

      - name: Configure signing keypair
        env:
          RIALO_DEPLOY_KEY: ${{ secrets.RIALO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RIALO_DEPLOY_KEY}" ]; then
            echo "::error::Secret RIALO_DEPLOY_KEY belum diset. Settings > Secrets and variables > Actions."
            exit 1
          fi
          umask 077
          mkdir -p ~/.config/rialo
          printf '%s' "${RIALO_DEPLOY_KEY}" > ~/.config/rialo/id.json
          chmod 600 ~/.config/rialo/id.json
          python3 - <<'EOF'
          import json, os, sys
          p = os.path.expanduser("~/.config/rialo/id.json")
          try:
              k = json.load(open(p))
          except Exception as e:
              print(f"::error::id.json bukan JSON valid: {e}"); sys.exit(1)
          if not isinstance(k, list) or len(k) != 64:
              print(f"::error::Keypair harus array 64 byte, dapat {type(k).__name__} panjang {len(k) if isinstance(k, list) else '?'}")
              sys.exit(1)
          if any((not isinstance(b, int)) or b < 0 or b > 255 for b in k):
              print("::error::Keypair berisi nilai di luar rentang byte"); sys.exit(1)
          print("Bentuk keypair valid (64 byte).")
          EOF

      - name: Switch network
        run: rialo config network switch ${{ inputs.network }}

      - name: Fund deployer (2x airdrop for Loader V4 buffer rent)
        run: |
          set -uo pipefail
          echo "Meminta 2x airdrop (minimal ~1.1 RLO untuk memenuhi rent buffer Loader V4)..."
          rialo client airdrop -n ${{ inputs.network }} --amount 1 || echo "::warning::Airdrop 1 gagal atau rate-limited"
          sleep 3
          rialo client airdrop -n ${{ inputs.network }} --amount 1 || echo "::warning::Airdrop 2 gagal atau rate-limited"

      - name: Deploy program
        run: |
          set -euo pipefail
          cd "${CONTRACT_DIR}"
          POLKAVM_FILE=$(find . -name "*.polkavm" | head -1)
          if [ -n "${POLKAVM_FILE}" ] && [ -f "${POLKAVM_FILE}" ]; then
            echo "Deploying binary artifact: ${POLKAVM_FILE}"
            rialo client program deploy "${POLKAVM_FILE}" 2>&1 | tee /tmp/deploy.log
          else
            echo "Deploying via deploy-venus..."
            rialo client program deploy-venus . 2>&1 | tee /tmp/deploy.log
          fi
          echo "PROGRAM_ID_RAW=$(grep -oE '[1-9A-HJ-NP-Za-km-z]{32,44}' /tmp/deploy.log | head -1)" >> "$GITHUB_ENV"

      - name: Verify on-chain deployment (Loader V4 48-Byte Header + Payload Hash)
        run: |
          set -euo pipefail
          if [ -z "${PROGRAM_ID_RAW:-}" ]; then
            echo "::error::Tidak ada string berbentuk program ID di output deploy"
            exit 1
          fi
          
          echo "Memverifikasi akun program di on-chain Rialo (${{ inputs.network }})..."
          ACCOUNT_JSON=$(rialo client account -n ${{ inputs.network }} --json "${PROGRAM_ID_RAW}" || true)
          
          if [ -z "${ACCOUNT_JSON}" ]; then
            echo "::warning::Query akun gagal atau CLI belum sinkron."
          else
            OWNER=$(echo "${ACCOUNT_JSON}" | jq -r .owner)
            EXECUTABLE=$(echo "${ACCOUNT_JSON}" | jq -r .executable)
            echo "Owner: ${OWNER}"
            echo "Executable: ${EXECUTABLE}"
            
            ONCHAIN_PAYLOAD_SHA=$(echo "${ACCOUNT_JSON}" | jq -r .data | base64 -d | tail -c +49 | sha256sum | awk '{print $1}')
            echo "On-Chain Payload SHA256 (offset +48): ${ONCHAIN_PAYLOAD_SHA}"
          fi
          
          echo "### Hasil Deployment ke ${{ inputs.network }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Program ID**: `${PROGRAM_ID_RAW}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: Selesai dideploy ke Loader V4." >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe keypair
        if: always()
        run: shred -u ~/.config/rialo/id.json 2>/dev/null || rm -f ~/.config/rialo/id.json