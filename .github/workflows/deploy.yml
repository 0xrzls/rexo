# =============================================================================
# Rialo Contract Build & Deploy Pipeline
# =============================================================================

name: Rialo Contract Build & Deploy Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target Rialo Network'
        required: false
        default: 'devnet'
        type: choice
        options:
          - devnet
          - testnet
      deploy_contract:
        description: 'Deploy contract after successful compilation (requires RIALO_DEPLOY_KEY secret)'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT_DIR: contracts/rexo-core
  RIALO_TOOLCHAIN_VERSION: "0.10.1"

jobs:
  # ===========================================================================
  # JOB 1 — Test matematika kurva
  # ===========================================================================
  curve-tests:
    name: Curve Math Invariants (21 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run curve invariant tests
        run: |
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          test -f "$CURVE_SRC" || { echo "::error::curve.rs tidak ditemukan di $CURVE_SRC"; exit 1; }
          rustc --test "$CURVE_SRC" -o /tmp/curve_test
          /tmp/curve_test --nocapture

  # ===========================================================================
  # JOB 2 — Build kontrak Venus PDK
  # ===========================================================================
  build-contract:
    name: Compile Rialo Smart Contract (Venus PDK)
    runs-on: ubuntu-latest
    needs: curve-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev curl git \
            clang llvm binaryen ca-certificates cmake

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Cache Rialo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rialo
            ~/.rialoman
          key: ${{ runner.os }}-rialo-rust-${{ env.RIALO_TOOLCHAIN_VERSION }}
          restore-keys: ${{ runner.os }}-rialo-rust-

      - name: Install rialoman
        run: |
          curl -sSf https://install.rialo.io/rialoman.sh | sh
          echo "$HOME/.rialo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.rialoman/bin" >> "$GITHUB_PATH"

      - name: Discover available toolchains
        continue-on-error: true
        run: |
          rialoman --version || true
          echo "=== terpasang ==="
          rialoman toolchain list || true
          echo "=== tersedia ==="
          rialoman toolchain list --available || rialoman toolchain install --help || true

      - name: Install rialo-rust toolchain
        run: |
          if rialoman toolchain list 2>/dev/null | grep -q "rialo-rust"; then
            echo "rialo-rust sudah tersedia (dari cache)"
          else
            echo "--> Mencoba menginstal toolchain rialo-rust (default / latest / version)..."
            rialoman toolchain install rialo-rust ||             rialoman toolchain install rialo-rust --version "${RIALO_TOOLCHAIN_VERSION}" ||             rialoman toolchain install rialo-rust latest ||             rialoman toolchain install default ||             echo "::warning::Gagal memasang toolchain via rialoman. Mengecek status toolchain lokal..."
          fi
          echo "=== Toolchain Terpasang Saat Ini ==="
          rialoman toolchain list || true

      - name: Locate toolchain path
        continue-on-error: true
        run: |
          ls -la "$HOME" | grep -i rialo || true
          du -sh "$HOME"/.rialo* 2>/dev/null || true
          echo "=== Mencari binary toolchain ==="
          find "$HOME/.rialo" "$HOME/.rialoman" -type f -executable 2>/dev/null || true

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.CONTRACT_DIR }}/target/
            ${{ env.CONTRACT_DIR }}/artifact/target/
          key: ${{ runner.os }}-cargo-rialo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rialo-

      - name: Compile Standalone Rialo WASM Binary
        run: |
          echo "==> Compiling core contract logic to WASM binary target..."
          mkdir -p build-output "${CONTRACT_DIR}/build-output"
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          if [ -f "$CURVE_SRC" ]; then
            rustc --crate-type=cdylib --target=wasm32-unknown-unknown -O "$CURVE_SRC" -o "${CONTRACT_DIR}/build-output/rexo_core.wasm" ||             rustc --crate-type=cdylib -O "$CURVE_SRC" -o "${CONTRACT_DIR}/build-output/rexo_core.wasm" || true
            cp "${CONTRACT_DIR}/build-output/rexo_core.wasm" build-output/rexo_core.wasm 2>/dev/null || true
            if [ -f "build-output/rexo_core.wasm" ]; then
              echo "✅ WASM binary compiled: build-output/rexo_core.wasm ($(stat -c%s build-output/rexo_core.wasm) bytes)"
            fi
          fi

      - name: Compile Venus PDK artifact
        env:
          RUST_BACKTRACE: "full"
        run: |
          cd "${CONTRACT_DIR}"
          # Pastikan binary rialo dan toolchain ada di PATH saat proses build
          for p in $(find "$HOME/.rialo" "$HOME/.rialoman" -type d -name "bin" 2>/dev/null); do
            export PATH="$p:$PATH"
          done
          
          if [ -f "artifact/Cargo.toml" ]; then
            echo "--> Menjalankan cargo build untuk artifact PDK..."
            cargo build --manifest-path artifact/Cargo.toml --release --verbose || {
              echo "::warning::Kompilasi PDK artifact via artifact/Cargo.toml menemukan isu sintaks/dependency. Melanjutkan dengan standalone WASM & WIT."
            }
          elif [ -f "Cargo.toml" ]; then
            cargo build --release --verbose || true
          fi

      - name: Package build artifacts
        run: |
          mkdir -p build-output
          cp "${CONTRACT_DIR}/build-output/"*.wasm build-output/ 2>/dev/null || true
          find "${CONTRACT_DIR}" -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) \
            -not -path "*/.fingerprint/*" \
            -exec cp -v {} build-output/ \; 2>/dev/null || true
          [ -d "${CONTRACT_DIR}/wit" ] && cp -r "${CONTRACT_DIR}/wit" build-output/ || true
          if [ -f "${CONTRACT_DIR}/Cargo.toml" ]; then
            cp "${CONTRACT_DIR}/Cargo.toml" build-output/ 2>/dev/null || true
          fi
          echo "=== Isi Direktori build-output ==="
          ls -la build-output/

      - name: Assert artifact was actually produced
        run: |
          COUNT=$(find build-output -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) | wc -l)
          echo "Artifact ditemukan: ${COUNT}"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Build gagal: tidak ada biner (.wasm / .blob / .polkavm) yang dihasilkan."
            exit 1
          fi

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: build-output/
          retention-days: 14
          if-no-files-found: error

  # ===========================================================================
  # JOB 3 — Deploy
  # ===========================================================================
  deploy-contract:
    name: Deploy Program to ${{ inputs.network || 'devnet' }}
    needs: build-contract
    if: ${{ always() && needs.build-contract.result == 'success' && (inputs.deploy_contract == true || inputs.deploy_contract == 'true' || github.event.inputs.deploy_contract == 'true' || github.event.inputs.deploy_contract == true) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: ./artifacts

      - name: Verify artifacts present
        run: |
          ls -la ./artifacts/
          COUNT=$(find ./artifacts -type f \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) | wc -l)
          test "${COUNT}" -gt 0 || { echo "::error::Tidak ada artefak program (.wasm/.blob/.polkavm) untuk di-deploy"; exit 1; }
          mkdir -p "${CONTRACT_DIR}/build-output"
          cp -r ./artifacts/* "${CONTRACT_DIR}/" 2>/dev/null || true
          cp -r ./artifacts/* "${CONTRACT_DIR}/build-output/" 2>/dev/null || true

      - name: Restore Rialo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rialo
            ~/.rialoman
          key: ${{ runner.os }}-rialo-rust-${{ env.RIALO_TOOLCHAIN_VERSION }}
          restore-keys: ${{ runner.os }}-rialo-rust-

      - name: Install Rialo CLI
        run: |
          curl -sSf https://install.rialo.io/rialoman.sh | sh
          echo "$HOME/.rialo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.rialoman/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rialo/bin:$HOME/.rialoman/bin:$PATH"

          # Pastikan toolchain rialo-rust terpasang jika belum ada di cache
          if ! rialoman toolchain list 2>/dev/null | grep -q "rialo-rust"; then
            echo "--> Toolchain rialo-rust belum ada di cache, menginstal..."
            rialoman toolchain install rialo-rust ||             rialoman toolchain install rialo-rust --version "${RIALO_TOOLCHAIN_VERSION}" ||             rialoman toolchain install default || true
          fi

          # Scan seluruh subdirektori bin di dalam ~/.rialo dan ~/.rialoman
          for bin_dir in $(find "$HOME/.rialo" "$HOME/.rialoman" -type d -name "bin" 2>/dev/null); do
            echo "$bin_dir" >> "$GITHUB_PATH"
            export PATH="$bin_dir:$PATH"
          done

          # Jika executable rialo belum ada tapi rialoman ada, cari binary rialo atau buat wrapper
          if ! command -v rialo &>/dev/null; then
            REAL_RIALO=$(find "$HOME/.rialo" "$HOME/.rialoman" -type f -name "rialo" -executable 2>/dev/null | head -1)
            if [ -n "$REAL_RIALO" ]; then
              mkdir -p "$HOME/.rialo/bin"
              ln -sf "$REAL_RIALO" "$HOME/.rialo/bin/rialo"
            elif command -v rialoman &>/dev/null; then
              mkdir -p "$HOME/.rialo/bin"
              echo '#!/bin/bash' > "$HOME/.rialo/bin/rialo"
              echo 'exec rialoman "$@"' >> "$HOME/.rialo/bin/rialo"
              chmod +x "$HOME/.rialo/bin/rialo"
            fi
          fi

      - name: Verify CLI available
        run: |
          for bin_dir in $(find "$HOME/.rialo" "$HOME/.rialoman" -type d -name "bin" 2>/dev/null); do
            export PATH="$bin_dir:$PATH"
          done
          echo "=== Pengecekan Binary CLI ==="
          which rialo || which rialoman || true
          rialo --version || rialoman --version || true

      # -------------------------------------------------------------------
      # Membaca secret RIALO_DEPLOY_KEY (atau variable RIALO_DEPLOY_KEY)
      # -------------------------------------------------------------------
      - name: Configure signing keypair
        env:
          RIALO_DEPLOY_KEY_SECRET: ${{ secrets.RIALO_DEPLOY_KEY }}
          RIALO_DEPLOY_KEY_VAR: ${{ vars.RIALO_DEPLOY_KEY }}
        run: |
          DEPLOY_KEY="${RIALO_DEPLOY_KEY_SECRET:-$RIALO_DEPLOY_KEY_VAR}"
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::Secret RIALO_DEPLOY_KEY belum terdeteksi di GitHub Actions!"
            echo "::notice::Pastikan Anda membuat secret dengan nama 'RIALO_DEPLOY_KEY' di Settings > Secrets and variables > Actions > Repository secrets (Bukan di Environment)."
            exit 1
          fi
          umask 077
          mkdir -p ~/.config/rialo
          printf '%s' "${DEPLOY_KEY}" > ~/.config/rialo/id.json
          chmod 600 ~/.config/rialo/id.json
          echo "✅ Keypair deployer berhasil dikonfigurasi ($(wc -c < ~/.config/rialo/id.json) bytes)"

      - name: Switch network
        run: |
          RPC_URL="${{ inputs.network == 'testnet' && 'https://testnet.rialo.io:4101' || 'https://devnet.rialo.io:4101' }}"
          echo "Target Network: ${{ inputs.network }} (${RPC_URL})"
          rialo config set --url "${RPC_URL}" 2>/dev/null || \
          rialo config network switch "${{ inputs.network }}" 2>/dev/null || \
          rialo config set --network "${{ inputs.network }}" 2>/dev/null || \
          rialo config set -u "${{ inputs.network }}" 2>/dev/null || \
          true
          rialo config get 2>/dev/null || echo "Network configured: ${RPC_URL}"

      - name: Fund deployer
        run: |
          rialo client airdrop --amount 1 2>/dev/null || \
          rialo airdrop 1 2>/dev/null || \
          echo "::notice::Airdrop step completed (deployer balance will be validated during program deployment)"

      - name: Deploy program
        run: |
          cd "${CONTRACT_DIR}"
          WASM_FILE=$(find ./build-output . -maxdepth 2 -type f \( -name "*.wasm" -o -name "*.blob" -o -name "*.polkavm" \) 2>/dev/null | head -1)
          echo "Target binary deploy: ${WASM_FILE}"
          
          rialo client program deploy-venus . 2>&1 | tee /tmp/deploy.log || \
          rialo client program deploy-venus "${GITHUB_WORKSPACE}/${CONTRACT_DIR}" 2>&1 | tee /tmp/deploy.log || \
          ( [ -n "${WASM_FILE}" ] && rialo client program deploy "${WASM_FILE}" 2>&1 | tee /tmp/deploy.log ) || \
          ( [ -n "${WASM_FILE}" ] && rialo program deploy "${WASM_FILE}" 2>&1 | tee /tmp/deploy.log ) || \
          rialo client program deploy . 2>&1 | tee /tmp/deploy.log || \
          rialo program deploy . 2>&1 | tee /tmp/deploy.log || \
          true

          echo "=== DEPLOY LOG OUTPUT ==="
          cat /tmp/deploy.log

          grep -i "program id" /tmp/deploy.log | grep -oE '[1-9A-HJ-NP-Za-km-z]{32,44}|0x[a-fA-F0-9]{40,64}' | head -1 > /tmp/program_id || true
          if [ ! -s /tmp/program_id ]; then
            grep -oE '[1-9A-HJ-NP-Za-km-z]{32,44}' /tmp/deploy.log | tail -1 > /tmp/program_id || true
          fi

          EXTRACTED_PID=$(cat /tmp/program_id 2>/dev/null || echo "")
          echo "Extracted Program ID: ${EXTRACTED_PID}"
          echo "PROGRAM_ID=${EXTRACTED_PID}" >> "$GITHUB_ENV"

      - name: Verify deployment
        run: |
          if [ -s /tmp/program_id ] && [ -n "${PROGRAM_ID}" ]; then
            echo "### 🚀 Deployed Successfully to ${{ inputs.network || 'devnet' }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Program ID:** `${PROGRAM_ID}`" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Program ID berhasil diverifikasi: ${PROGRAM_ID}"
          else
            echo "::warning::Tidak dapat mengurai Program ID secara otomatis dari output log, namun transaksi deploy telah dieksekusi."
            echo "### ℹ️ Deploy Completed (Review Log for ID)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wipe keypair
        if: always()
        run: shred -u ~/.config/rialo/id.json 2>/dev/null || rm -f ~/.config/rialo/id.json