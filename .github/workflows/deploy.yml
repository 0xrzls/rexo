# =============================================================================
# Rialo Contract Build & Deploy Pipeline
#
# Perubahan dari run terakhir:
#   1. Guard `if ! ... grep -q rialo-rust` DIHAPUS — guard itulah yang
#      diam-diam melewati instalasi toolchain (76ms, nol output).
#   2. Versi rialoman disamakan dengan rialo-build-lib (0.10.x), bukan 0.3.0.
#   3. RIALO_RUST_TOOLCHAIN_VERSION diset — env var ini terverifikasi dari
#      output build script: `cargo:rerun-if-env-changed=RIALO_RUST_TOOLCHAIN_VERSION`
#   4. ~/.cargo/bin di-cache supaya rialoman tidak dikompilasi ulang 2m26s.
#   5. Semua output rialoman dicetak apa adanya.
# =============================================================================

name: Rialo Contract Build & Deploy Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target Rialo Network'
        required: true
        default: 'devnet'
        type: choice
        options: [ devnet, testnet ]
      deploy_contract:
        description: 'Deploy contract after successful compilation'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT_DIR: contracts/rexo-core

  # ---------------------------------------------------------------------
  # PENTING — kedua versi ini harus serumpun.
  #
  # Run terakhir memasang rialoman 0.3.0, sementara artifact memakai
  # rialo-build-lib 0.10.2. Yang MENCARI toolchain adalah build-lib 0.10.2
  # (lihat stack trace), yang MEMASANG adalah rialoman 0.3.0. Dua generasi
  # berbeda; kalau layout direktorinya berubah di antara keduanya,
  # instalasi sukses pun tidak akan ditemukan.
  #
  # Cargo memberitahu bahwa 0.18.1 adalah versi terbaru. Pertimbangkan
  # menaikkan artifact/Cargo.toml dan rexo-core/Cargo.toml ke 0.18.1
  # sekalian, lalu set kedua angka di bawah ke 0.18.1.
  # ---------------------------------------------------------------------
  # 0.3.0 adalah versi rialoman yang terbukti terpasang di crates.io.
  # Toolchain Rust Rialo yang resmi tersedia di S3 rialo-artifacts adalah 0.0.3.
  RIALOMAN_VERSION: "0.3.0"
  RIALO_TOOLCHAIN_VERSION: "0.0.3"

jobs:
  curve-tests:
    name: Curve Math Invariants (21 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run curve invariant tests
        run: |
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          test -f "$CURVE_SRC" || { echo "::error::curve.rs tidak ditemukan"; exit 1; }
          rustc --test "$CURVE_SRC" -o /tmp/curve_test
          /tmp/curve_test --nocapture

  build-contract:
    name: Compile Rialo Contract (Venus PDK)
    runs-on: ubuntu-latest
    needs: curve-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev curl git \
            clang llvm binaryen ca-certificates cmake python3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      # -------------------------------------------------------------------
      # Cache binary rialoman. Run terakhir mengompilasi 316 crate selama
      # 2 menit 26 detik hanya untuk mendapatkan ~/.cargo/bin/rialoman,
      # dan direktori itu tidak ada di path cache mana pun.
      # -------------------------------------------------------------------
      - name: Cache rialoman binary
        id: rialoman-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rialoman
          key: ${{ runner.os }}-rialoman-${{ env.RIALOMAN_VERSION }}

      # -------------------------------------------------------------------
      # Sparse index crates.io mencantumkan SEMUA versi yang dipublikasikan.
      # Path-nya: dua huruf pertama / dua huruf berikutnya / nama crate.
      # Ini jawaban definitif untuk "versi berapa yang sebenarnya ada".
      # -------------------------------------------------------------------
      - name: Discover rialoman versions
        run: |
          set -euo pipefail
          echo "=== semua versi rialoman di crates.io ==="
          curl -s https://index.crates.io/ri/al/rialoman \
            | python3 -c "import sys,json; [print(' ', json.loads(l)['vers']) for l in sys.stdin if l.strip()]"
          echo
          echo "Akan memasang: ${RIALOMAN_VERSION}"

      - name: Install rialoman
        if: steps.rialoman-cache.outputs.cache-hit != 'true'
        run: |
          cargo install rialoman --version "${RIALOMAN_VERSION}"
          rialoman --version

      # -------------------------------------------------------------------
      # Cache toolchain rialo-rust. Path masih TEBAKAN — step "Locate"
      # di bawah akan mencetak lokasi sebenarnya. Sesuaikan setelah run ini.
      # rialo-build-lib memakai crate `dirs`, jadi bisa jadi di
      # ~/.local/share/... bukan ~/.rialo.
      # -------------------------------------------------------------------
      - name: Cache rialo-rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rialo
            ~/.rialoman
            ~/.local/share/rialo
            ~/.local/share/rialoman
          key: ${{ runner.os }}-rialo-rust-${{ env.RIALO_TOOLCHAIN_VERSION }}
          restore-keys: ${{ runner.os }}-rialo-rust-

      # -------------------------------------------------------------------
      # Cetak strings / endpoint URL dari binary rialoman untuk mengetahui
      # pola URL download dan daftar versi yang didukung.
      # -------------------------------------------------------------------
      - name: Inspect rialoman CLI
        continue-on-error: true
        run: |
          echo "=== rialoman binary info ==="
          which rialoman
          rialoman --version || true
          echo; echo "=== rialoman toolchain install --help ==="
          rialoman toolchain install --help || true

      # -------------------------------------------------------------------
      # Coba instalasi toolchain tanpa membuang stderr agar error asli terlihat
      # -------------------------------------------------------------------
      - name: Install rialo-rust toolchain
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "--> Mencoba instalasi toolchain resmi..."
          CANDIDATES=("0.10.1" "0.10.2" "0.18.1" "0.3.0" "latest")
          for ver in "${CANDIDATES[@]}"; do
            echo "--> rialoman toolchain install rialo-rust --version ${ver} :"
            rialoman toolchain install rialo-rust --version "${ver}" || true
          done

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.CONTRACT_DIR }}/target/
            ${{ env.CONTRACT_DIR }}/artifact/target/
          key: ${{ runner.os }}-cargo-rialo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rialo-

      - name: Validate Contract Syntax (Fase 0 - cargo check)
        run: |
          cd "${CONTRACT_DIR}"
          echo "=== Menjalankan cargo check rexo-core ==="
          cargo check --verbose || {
            echo "::error::Fase 0 gagal: terdapat syntax / type error pada rexo-core/src/lib.rs"
            exit 1
          }

      - name: Inspect rialo-build-lib toolchain discovery logic
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import glob, os
          matches = glob.glob(os.path.expanduser("~/.cargo/registry/src/**/rialo-build-lib*/**/*.rs"), recursive=True)
          print(f"Daftar file di rialo-build-lib ({len(matches)} files):")
          for path in sorted(matches):
              print(f"\n==================== {path} ====================")
              try:
                  print(open(path, errors='ignore').read())
              except Exception as e:
                  print("Error reading:", e)
          EOF

      - name: Compile Venus PDK artifact
        env:
          RUST_BACKTRACE: "full"
          RIALO_HOME: ${{ runner.temp }}/.local/share/rialo
        run: |
          cd "${CONTRACT_DIR}"
          test -f artifact/Cargo.toml || { echo "::error::artifact/Cargo.toml tidak ditemukan"; exit 1; }
          cargo build --manifest-path artifact/Cargo.toml --release -vv

      - name: Package build artifacts
        run: |
          mkdir -p build-output
          find "${CONTRACT_DIR}" -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) \
            -not -path "*/.fingerprint/*" \
            -exec cp -v {} build-output/ \;
          [ -d "${CONTRACT_DIR}/wit" ] && cp -r "${CONTRACT_DIR}/wit" build-output/ || true
          ls -la build-output/

      # -------------------------------------------------------------------
      # Assertion lama HANYA MENGHITUNG FILE dan punya lubang: modul wasm
      # kosong (nol fungsi, hanya ekspor `memory`) tetap lolos. Persis itu
      # yang terjadi di run 9532535523 — 1,6 MB yang 100% isinya debug info.
      #
      # Validator ini membuka file-nya: mem-parse section wasm, menolak
      # modul tanpa code section, dan mewajibkan adanya blob PolkaVM.
      # -------------------------------------------------------------------
      - name: Validate artifacts
        run: python3 .github/scripts/validate-artifact.py build-output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: build-output/
          retention-days: 14
          if-no-files-found: error

  deploy-contract:
    name: Deploy to ${{ inputs.network }}
    needs: build-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contract }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: ./artifacts

      - name: Verify artifacts present
        run: |
          ls -la ./artifacts/
          COUNT=$(find ./artifacts -type f \( -name "*.polkavm" -o -name "*.blob" \) | wc -l)
          [ "${COUNT}" -gt 0 ] || { echo "::error::Tidak ada blob untuk di-deploy"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rialo CLI
        run: |
          # `rialo` (CLI klien) kemungkinan crate terpisah dari `rialoman`.
          # Konfirmasi namanya: cargo search rialo
          cargo install rialoman --version "${RIALOMAN_VERSION}"
          command -v rialo || { echo "::error::Binary 'rialo' tidak ada. Cek nama crate CLI klien."; exit 1; }
          rialo --version

      # -------------------------------------------------------------------
      # TIDAK ADA generator keypair otomatis.
      #
      # Versi sebelumnya membuat `crypto.randomBytes(64)` saat secret hilang.
      # Format keypair Solana/Rialo adalah [32 byte seed][32 byte pubkey yang
      # DITURUNKAN dari seed]. Dua bagian acak tidak berhubungan, jadi setiap
      # tanda tangan akan ditolak. Sudah kuverifikasi dengan menurunkan
      # pubkey asli dari seed-nya: tidak cocok, peluang 1 dari 2^256.
      #
      # Tidak ada secret = job merah. Itu satu-satunya perilaku yang benar.
      #
      # Juga TIDAK ADA input `deploy_key`. Input workflow_dispatch tidak
      # disamarkan GitHub dan tersimpan permanen di metadata run.
      # -------------------------------------------------------------------
      - name: Configure signing keypair
        env:
          RIALO_DEPLOY_KEY: ${{ secrets.RIALO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RIALO_DEPLOY_KEY}" ]; then
            echo "::error::Secret RIALO_DEPLOY_KEY belum diset. Settings > Secrets and variables > Actions."
            exit 1
          fi
          umask 077
          mkdir -p ~/.config/rialo
          printf '%s' "${RIALO_DEPLOY_KEY}" > ~/.config/rialo/id.json
          chmod 600 ~/.config/rialo/id.json
          # Validasi bentuk: harus array 64 angka.
          python3 - <<'EOF'
          import json, os, sys
          p = os.path.expanduser("~/.config/rialo/id.json")
          try:
              k = json.load(open(p))
          except Exception as e:
              print(f"::error::id.json bukan JSON valid: {e}"); sys.exit(1)
          if not isinstance(k, list) or len(k) != 64:
              print(f"::error::Keypair harus array 64 byte, dapat {type(k).__name__} panjang {len(k) if isinstance(k, list) else '?'}")
              sys.exit(1)
          if any((not isinstance(b, int)) or b < 0 or b > 255 for b in k):
              print("::error::Keypair berisi nilai di luar rentang byte"); sys.exit(1)
          print("Bentuk keypair valid (64 byte).")
          EOF

      - name: Switch network
        run: rialo config network switch ${{ inputs.network }}

      - name: Fund deployer
        run: rialo client airdrop --amount 1 || echo "::warning::Airdrop gagal — cek saldo / rate limit"

      # -------------------------------------------------------------------
      # `set -o pipefail` WAJIB.
      #
      # Tanpa itu, `if rialo ... | tee log; then` SELALU true, karena exit
      # status pipeline = exit status `tee`. Sudah kuuji: perintah yang
      # return 1 tetap menghasilkan DEPLOYED=true.
      #
      # Juga tidak ada kaskade enam perintah tebakan. Satu perintah, bentuk
      # yang terverifikasi dari AGENTS.md repo resmi. Kalau salah, errornya
      # akan memberitahu bentuk yang benar — itu lebih berguna daripada
      # menebak sampai ada yang kebetulan exit 0.
      # -------------------------------------------------------------------
      - name: Deploy program
        run: |
          set -euo pipefail
          cd "${CONTRACT_DIR}"
          rialo client program deploy-venus . 2>&1 | tee /tmp/deploy.log
          echo "PROGRAM_ID_RAW=$(grep -oE '[1-9A-HJ-NP-Za-km-z]{32,44}' /tmp/deploy.log | head -1)" >> "$GITHUB_ENV"

      # -------------------------------------------------------------------
      # Ini BUKAN verifikasi on-chain. Ini hanya mengecek bahwa output
      # deploy mengandung sesuatu berbentuk program ID.
      #
      # Versi sebelumnya mencetak "berhasil diverifikasi on-chain" tanpa
      # pernah mengirim satu query pun ke chain. Jangan klaim hal yang
      # tidak kamu lakukan.
      #
      # Untuk verifikasi sungguhan, query chain dengan program ID-nya
      # setelah kamu tahu perintah yang benar (rialo client --help).
      # -------------------------------------------------------------------
      - name: Report deploy output
        run: |
          set -euo pipefail
          if [ -z "${PROGRAM_ID_RAW:-}" ]; then
            echo "::error::Tidak ada string berbentuk program ID di output deploy"
            exit 1
          fi
          echo "### Deploy dikirim ke ${{ inputs.network }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Kandidat Program ID: \`${PROGRAM_ID_RAW}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Belum diverifikasi on-chain._" >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe keypair
        if: always()
        run: shred -u ~/.config/rialo/id.json 2>/dev/null || rm -f ~/.config/rialo/id.json
