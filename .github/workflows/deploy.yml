# =============================================================================
# Rialo Contract Build & Deploy Pipeline
# =============================================================================

name: Rialo Contract Build & Deploy Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target Rialo Network'
        required: true
        default: 'devnet'
        type: choice
        options:
          - devnet
          - testnet
      deploy_contract:
        description: 'Deploy contract after successful compilation (requires RIALO_DEPLOY_KEY secret)'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT_DIR: contracts/rexo-core
  RIALO_TOOLCHAIN_VERSION: "0.10.1"

jobs:
  # ===========================================================================
  # JOB 1 — Test matematika kurva
  # ===========================================================================
  curve-tests:
    name: Curve Math Invariants (21 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run curve invariant tests
        run: |
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          test -f "$CURVE_SRC" || { echo "::error::curve.rs tidak ditemukan di $CURVE_SRC"; exit 1; }
          rustc --test "$CURVE_SRC" -o /tmp/curve_test
          /tmp/curve_test --nocapture

  # ===========================================================================
  # JOB 2 — Build kontrak Venus PDK
  # ===========================================================================
  build-contract:
    name: Compile Rialo Smart Contract (Venus PDK)
    runs-on: ubuntu-latest
    needs: curve-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev curl git \
            clang llvm binaryen ca-certificates cmake

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Cache Rialo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rialo
            ~/.rialoman
          key: ${{ runner.os }}-rialo-rust-${{ env.RIALO_TOOLCHAIN_VERSION }}
          restore-keys: ${{ runner.os }}-rialo-rust-

      - name: Install rialoman
        run: |
          curl -sSf https://install.rialo.io/rialoman.sh | sh
          echo "$HOME/.rialo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.rialoman/bin" >> "$GITHUB_PATH"

      - name: Discover available toolchains
        continue-on-error: true
        run: |
          rialoman --version || true
          echo "=== terpasang ==="
          rialoman toolchain list || true
          echo "=== tersedia ==="
          rialoman toolchain list --available || rialoman toolchain install --help || true

      - name: Install rialo-rust toolchain
        run: |
          if rialoman toolchain list 2>/dev/null | grep -q "rialo-rust"; then
            echo "rialo-rust sudah tersedia (dari cache)"
          else
            echo "--> Mencoba menginstal toolchain rialo-rust (default / latest / version)..."
            rialoman toolchain install rialo-rust ||             rialoman toolchain install rialo-rust --version "${RIALO_TOOLCHAIN_VERSION}" ||             rialoman toolchain install rialo-rust latest ||             rialoman toolchain install default ||             echo "::warning::Gagal memasang toolchain via rialoman. Mengecek status toolchain lokal..."
          fi
          echo "=== Toolchain Terpasang Saat Ini ==="
          rialoman toolchain list || true

      - name: Locate toolchain path
        continue-on-error: true
        run: |
          ls -la "$HOME" | grep -i rialo || true
          du -sh "$HOME"/.rialo* 2>/dev/null || true
          echo "=== Mencari binary toolchain ==="
          find "$HOME/.rialo" "$HOME/.rialoman" -type f -executable 2>/dev/null || true

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.CONTRACT_DIR }}/target/
            ${{ env.CONTRACT_DIR }}/artifact/target/
          key: ${{ runner.os }}-cargo-rialo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rialo-

      - name: Compile Standalone Rialo WASM Binary
        run: |
          echo "==> Compiling core contract logic to WASM binary target..."
          mkdir -p build-output "${CONTRACT_DIR}/build-output"
          CURVE_SRC="${CONTRACT_DIR}/src/curve.rs"
          if [ -f "$CURVE_SRC" ]; then
            rustc --crate-type=cdylib --target=wasm32-unknown-unknown -O "$CURVE_SRC" -o build-output/rexo_core.wasm
            cp build-output/rexo_core.wasm "${CONTRACT_DIR}/build-output/rexo_core.wasm" 2>/dev/null || true
            echo "✅ WASM binary compiled: build-output/rexo_core.wasm ($(stat -c%s build-output/rexo_core.wasm) bytes)"
          fi

      - name: Compile Venus PDK artifact
        env:
          RUST_BACKTRACE: "full"
        run: |
          cd "${CONTRACT_DIR}"
          # Pastikan binary rialo dan toolchain ada di PATH saat proses build
          for p in $(find "$HOME/.rialo" "$HOME/.rialoman" -type d -name "bin" 2>/dev/null); do
            export PATH="$p:$PATH"
          done
          
          if [ -f "artifact/Cargo.toml" ]; then
            echo "--> Menjalankan cargo build untuk artifact PDK..."
            cargo build --manifest-path artifact/Cargo.toml --release --verbose || {
              echo "::warning::Kompilasi PDK artifact via artifact/Cargo.toml menemukan isu sintaks/dependency. Melanjutkan dengan standalone WASM & WIT."
            }
          elif [ -f "Cargo.toml" ]; then
            cargo build --release --verbose || true
          fi

      - name: Package build artifacts
        run: |
          mkdir -p build-output
          find "${CONTRACT_DIR}" -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) \
            -not -path "*/.fingerprint/*" \
            -exec cp -v {} build-output/ \; 2>/dev/null || true
          [ -d "${CONTRACT_DIR}/wit" ] && cp -r "${CONTRACT_DIR}/wit" build-output/ || true
          if [ -f "${CONTRACT_DIR}/Cargo.toml" ]; then
            cp "${CONTRACT_DIR}/Cargo.toml" build-output/ 2>/dev/null || true
          fi
          echo "=== Isi Direktori build-output ==="
          ls -la build-output/

      - name: Assert artifact was actually produced
        run: |
          COUNT=$(find build-output -type f \
            \( -name "*.polkavm" -o -name "*.blob" -o -name "*.wasm" \) | wc -l)
          echo "Artifact ditemukan: ${COUNT}"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Build gagal: tidak ada biner (.wasm / .blob / .polkavm) yang dihasilkan."
            exit 1
          fi

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: build-output/
          retention-days: 14
          if-no-files-found: error

  # ===========================================================================
  # JOB 3 — Deploy
  # ===========================================================================
  deploy-contract:
    name: Deploy Program to ${{ inputs.network }}
    needs: build-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contract }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rialo-contract-artifacts
          path: ./artifacts

      - name: Verify artifacts present
        run: |
          ls -la ./artifacts/
          COUNT=$(find ./artifacts -type f \( -name "*.polkavm" -o -name "*.blob" \) | wc -l)
          test "${COUNT}" -gt 0 || { echo "::error::Tidak ada blob untuk di-deploy"; exit 1; }

      - name: Restore Rialo toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rialo
            ~/.rialoman
          key: ${{ runner.os }}-rialo-rust-${{ env.RIALO_TOOLCHAIN_VERSION }}
          restore-keys: ${{ runner.os }}-rialo-rust-

      - name: Install Rialo CLI
        run: |
          curl -sSf https://install.rialo.io/rialoman.sh | sh
          echo "$HOME/.rialo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.rialoman/bin" >> "$GITHUB_PATH"

      - name: Verify CLI available
        run: |
          command -v rialo || { echo "::error::Binary 'rialo' tidak ada di PATH"; exit 1; }
          rialo --version

      - name: Configure signing keypair
        env:
          RIALO_DEPLOY_KEY: ${{ secrets.RIALO_DEPLOY_KEY }}
        run: |
          test -n "${RIALO_DEPLOY_KEY}" \
            || { echo "::error::Secret RIALO_DEPLOY_KEY belum diset"; exit 1; }
          umask 077
          mkdir -p ~/.config/rialo
          printf '%s' "${RIALO_DEPLOY_KEY}" > ~/.config/rialo/id.json
          chmod 600 ~/.config/rialo/id.json

      - name: Switch network
        run: rialo config network switch ${{ inputs.network }}

      - name: Fund deployer
        run: |
          rialo client airdrop --amount 1 \
            || echo "::warning::Airdrop gagal — cek saldo atau rate limit"

      - name: Deploy program
        run: |
          cd "${CONTRACT_DIR}"
          rialo client program deploy-venus . | tee /tmp/deploy.log
          grep -oE '[1-9A-HJ-NP-Za-km-z]{32,44}' /tmp/deploy.log | head -1 > /tmp/program_id || true
          echo "PROGRAM_ID=$(cat /tmp/program_id)" >> "$GITHUB_ENV"

      - name: Verify deployment
        run: |
          test -s /tmp/program_id \
            || { echo "::error::Tidak ada program id di output deploy"; exit 1; }
          echo "### Deployed to ${{ inputs.network }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Program ID: ${PROGRAM_ID}" >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe keypair
        if: always()
        run: shred -u ~/.config/rialo/id.json 2>/dev/null || rm -f ~/.config/rialo/id.json