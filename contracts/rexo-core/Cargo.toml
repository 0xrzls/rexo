[package]
name = "rexo-core"
description = "Rexo — meme coin launchpad native untuk Rialo"
version = "0.2.0"
edition = "2021"
publish = false

[package.metadata.cargo-machete]
ignored = ["rialo-venus"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
implementation = []
# Event terstruktur lewat syscall rlo_log_data. Nyalakan setelah kamu
# konfirmasi bentuk attribute #[event] terhadap contoh resmi.
events = ["dep:rialo-sol-attribute-event"]

[dependencies]
rialo-s-program        = { version = "0.12.2", default-features = false }
rialo-s-program-error  = { version = "0.12.2", features = ["borsh"] }
rialo-venus            = { version = "0.12.2" }
rialo-venus-proc-macro = { version = "0.12.2" }
rialo-spl-token-2022   = { version = "0.12.2", default-features = false, features = ["no-entrypoint"] }
rialo-sol-attribute-event = { version = "0.12.2", optional = true }
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_idioms = "warn"
unsafe_code = "forbid"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_feature, values("static-syscalls"))',
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint", "custom-panic", "custom-heap"))',
    'cfg(msim)',
    'cfg(fail_points)',
    'cfg(rialo_simtest_seed_sweep)',
    'cfg(bazel)',
]

[lints.clippy]
all = "warn"
arithmetic_side_effects = "warn"
integer_division = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
